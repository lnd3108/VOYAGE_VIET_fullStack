<section class="admin-destinations">
  <header class="admin-destinations__header">
    <div>
      <p class="admin-destinations__eyebrow">Admin Destinations</p>
      <h1>Quản lý điểm đến</h1>
      <p>Tạo và quản lý các điểm đến hiển thị trên tour và trang public</p>
    </div>

    <div class="admin-destinations__actions">
      <a routerLink="/admin/media" *ngIf="canOpenFullMediaLibrary()">Mở Media</a>
      <button type="button" (click)="openCreateForm()">Thêm điểm đến</button>
    </div>
  </header>

  <div class="admin-destinations__error" *ngIf="errorMessage">
    <p>{{ errorMessage }}</p>
    <button type="button" *ngIf="!loading" (click)="loadDestinations()">Thử lại</button>
  </div>

  <app-admin-destination-form
    *ngIf="isFormOpen"
    [mode]="isEditMode ? 'edit' : 'create'"
    [destination]="selectedDestination"
    (closed)="closeForm()"
    (completed)="loadDestinations()"
  />
  <app-admin-destination-filter
    [value]="currentFilters"
    [filteredCount]="filteredDestinations.length"
    [totalCount]="totalElements"
    (filterChange)="handleFilterChange($event)"
  />

  <app-admin-destination-bulk-actions
    [selectedDestinations]="selectedBatchDestinations"
    (completed)="loadDestinations()"
    (clearSelection)="clearBatchSelection()"
  />

  <app-admin-destination-table
    [destinations]="filteredDestinations"
    [loading]="loading"
    [selectedDestinationIds]="selectedDestinationIds"
    [page]="page"
    [size]="size"
    [totalElements]="totalElements"
    [totalPages]="totalPages"
    [first]="first"
    [last]="last"
    [pageSizeOptions]="pageSizeOptions"
    [fallbackImage]="fallbackImage"
    [showEmpty]="!errorMessage"
    (selectionToggle)="handleDestinationSelectionToggle($event)"
    (editRequested)="openEditForm($event)"
    (reviewRequested)="openPendingReview($event)"
    (completed)="loadDestinations()"
    (create)="openCreateForm()"
    (previousPage)="goToPreviousPage()"
    (nextPage)="goToNextPage()"
    (pageSizeChange)="changePageSize($event)"
  />

  <app-admin-destination-detail-panel
    *ngIf="detailDestination"
    [destination]="detailDestination"
    (closed)="closePendingReview()"
    (completed)="loadDestinations()"
  />

</section>
